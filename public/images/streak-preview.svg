<svg width="500" height="300" viewBox="0 0 500 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="300" rx="8" fill="#1F2937"/>
  
  <!-- Streak Calendar -->
  <rect x="50" y="50" width="400" height="200" rx="8" fill="#111827"/>
  
  <!-- Calendar Header -->
  <text x="170" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="white">Abril 2023</text>
  
  <!-- Calendar Days -->
  <text x="80" y="110" font-family="Arial" font-size="12" fill="#6B7280">L</text>
  <text x="130" y="110" font-family="Arial" font-size="12" fill="#6B7280">M</text>
  <text x="180" y="110" font-family="Arial" font-size="12" fill="#6B7280">X</text>
  <text x="230" y="110" font-family="Arial" font-size="12" fill="#6B7280">J</text>
  <text x="280" y="110" font-family="Arial" font-size="12" fill="#6B7280">V</text>
  <text x="330" y="110" font-family="Arial" font-size="12" fill="#6B7280">S</text>
  <text x="380" y="110" font-family="Arial" font-size="12" fill="#6B7280">D</text>
  
  <!-- Week 1 -->
  <circle cx="80" cy="140" r="15" fill="#374151"/>
  <text x="80" y="145" font-family="Arial" font-size="12" fill="white" text-anchor="middle">1</text>
  
  <circle cx="130" cy="140" r="15" fill="#374151"/>
  <text x="130" y="145" font-family="Arial" font-size="12" fill="white" text-anchor="middle">2</text>
  
  <circle cx="180" cy="140" r="15" fill="#F59E0B"/>
  <text x="180" y="145" font-family="Arial" font-size="12" fill="white" text-anchor="middle">3</text>
  
  <circle cx="230" cy="140" r="15" fill="#F59E0B"/>
  <text x="230" y="145" font-family="Arial" font-size="12" fill="white" text-anchor="middle">4</text>
  
  <circle cx="280" cy="140" r="15" fill="#F59E0B"/>
  <text x="280" y="145" font-family="Arial" font-size="12" fill="white" text-anchor="middle">5</text>
  
  <circle cx="330" cy="140" r="15" fill="#F59E0B"/>
  <text x="330" y="145" font-family="Arial" font-size="12" fill="white" text-anchor="middle">6</text>
  
  <circle cx="380" cy="140" r="15" fill="#F59E0B"/>
  <text x="380" y="145" font-family="Arial" font-size="12" fill="white" text-anchor="middle">7</text>
  
  <!-- Week 2 -->
  <circle cx="80" cy="180" r="15" fill="#F59E0B"/>
  <text x="80" y="185" font-family="Arial" font-size="12" fill="white" text-anchor="middle">8</text>
  
  <circle cx="130" cy="180" r="15" fill="#F59E0B"/>
  <text x="130" y="185" font-family="Arial" font-size="12" fill="white" text-anchor="middle">9</text>
  
  <circle cx="180" cy="180" r="15" fill="#F59E0B"/>
  <text x="180" y="185" font-family="Arial" font-size="12" fill="white" text-anchor="middle">10</text>
  
  <circle cx="230" cy="180" r="15" fill="#F59E0B"/>
  <text x="230" y="185" font-family="Arial" font-size="12" fill="white" text-anchor="middle">11</text>
  
  <circle cx="280" cy="180" r="15" fill="#F59E0B"/>
  <text x="280" y="185" font-family="Arial" font-size="12" fill="white" text-anchor="middle">12</text>
  
  <circle cx="330" cy="180" r="15" fill="#F59E0B"/>
  <text x="330" y="185" font-family="Arial" font-size="12" fill="white" text-anchor="middle">13</text>
  
  <circle cx="380" cy="180" r="15" fill="#F59E0B"/>
  <text x="380" y="185" font-family="Arial" font-size="12" fill="white" text-anchor="middle">14</text>
  
  <!-- Streak Counter -->
  <rect x="150" y="220" width="200" height="40" rx="20" fill="#F59E0B"/>
  <text x="250" y="245" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">¡12 días de racha!</text>
</svg>
